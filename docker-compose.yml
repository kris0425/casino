version: "3.3"

services:
  discord-casino:
    build: .
    container_name: discord-casino
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets:ro
      - ./activity/public:/app/activity/public:ro
      - ./scripts:/app/scripts:ro
      - ./updates:/app/updates:ro
      - ./src:/app/src:ro

  activity-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: casino-activity-api-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://discord-casino:8787
    depends_on:
      - discord-casino

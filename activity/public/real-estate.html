<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07131c">
  <title>城市建設｜澳門最大賭場</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/real-estate.css?v=20260815.8">
  <style>[hidden]{display:none!important}</style>
</head>
<body>
  <div class="sky"></div>
  <header class="topbar">
    <a id="homeLink" class="home" href="#">‹ <span>返回遊戲大廳</span></a>
    <div class="brand"><b>♠</b><span><strong>澳門最大賭場</strong><small>CITY BUILDER</small></span></div>
    <button id="refresh" class="soft">重新整理</button>
  </header>
  <main>
    <section class="headline">
      <div><span class="eyebrow">REAL ESTATE EMPIRE</span><h1>打造你的賭城天際線</h1><p>購買土地、興建事業、處理維修與市場事件，讓每一棟樓替你創造收入。</p></div>
      <div class="player"><img id="avatar" alt="玩家頭像"><div><small id="playerName">讀取中…</small><strong><span id="balance">—</span> 金幣</strong></div></div>
    </section>
    <section class="stats">
      <article><small>已解鎖土地</small><strong id="unlocked">—</strong><span>/ 6 塊</span></article>
      <article><small>營運建築</small><strong id="built">—</strong><span>棟</span></article>
      <article><small>累積事業收入</small><strong id="collected">—</strong><span>金幣</span></article>
    </section>
    <section class="city-shell">
      <div class="city-title"><div><span class="eyebrow">LIVE CITY MAP</span><h2>金光海灣開發區</h2></div><div class="legend"><i></i> 點選地塊管理</div></div>
      <div class="city" id="city" aria-label="房地產城市地圖"></div>
    </section>
    <section class="catalog-shell">
      <div class="city-title"><div><span class="eyebrow">BUILDING CATALOG</span><h2>事業建築圖鑑</h2></div><p>每級營收 +12%，最高 Lv.10</p></div>
      <div class="catalog" id="catalog"></div>
    </section>
  </main>
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog" hidden>
    <button class="sheet-close" id="sheetClose" aria-label="關閉">×</button>
    <span class="eyebrow" id="sheetDistrict">CITY LOT</span><h2 id="sheetTitle">地塊管理</h2><div id="sheetBody"></div>
  </section>
  <div class="loading" id="loading"><div></div><strong>正在載入城市…</strong><span>所有交易由 Oracle 即時驗證</span></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/real-estate.js?v=20260815.8" defer></script>
</body>
</html>

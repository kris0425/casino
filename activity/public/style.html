<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09070f">
  <title>角色造型｜澳門最大賭場</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css?v=20260905.7">
</head>
<body>
  <header><div class="brand"><span>♠</span><div><strong>澳門最大賭場</strong><small>CHARACTER STYLE</small></div></div><div class="player"><img id="avatar" alt="玩家頭像"><div><small>目前玩家</small><strong id="playerName">讀取中…</strong></div></div></header>
  <nav class="page-nav" aria-label="頁面導覽"><button id="backButton" type="button">← 返回上一頁</button><a id="homeButton" href="#" aria-disabled="true">⌂ 回到遊戲首頁</a></nav>
  <main>
    <section class="preview-panel">
      <div class="preview" id="preview"><img class="background" id="background" alt="展示背景"><div class="shade"></div><img class="character" id="characterImage" alt="角色完整造型"><div class="preview-copy"><small id="characterTheme">CHARACTER</small><h1 id="characterName">角色造型</h1><p id="styleName">讀取中…</p></div><span class="equipped-badge" id="equippedBadge">目前使用</span></div>
      <button class="equip" id="equip" type="button">套用這個完整造型</button>
      <button class="purchase" id="purchase" type="button" hidden>購買並套用完整造型</button>
      <p class="legacy-note">完整角色造型可永久購買；購入後會自動套用，並顯示於 Discord 的 /玩家 資料卡。舊版分層換裝維持停用。</p>
    </section>
    <section class="catalog-panel">
      <div class="heading"><div><small>CHARACTER SELECT</small><h2>選擇角色</h2></div><span id="sessionTime">安全連結</span></div>
      <nav class="character-tabs" id="characterTabs"></nav>
      <div class="heading styles-heading"><div><small>COMPLETE LOOKS</small><h2>完整造型</h2></div><span id="styleCount">—</span></div>
      <div class="style-grid" id="styleGrid"></div>
    </section>
  </main>
  <div class="loading" id="loading"><div class="spinner"></div><strong>正在讀取角色造型…</strong><p>所有造型由 Oracle 伺服器驗證</p></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/style.js?v=20260905.7" defer></script>
</body>
</html>
